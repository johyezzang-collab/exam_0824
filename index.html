<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 목록</title>
<style>
  @font-face {
      font-family: 'OngleipParkDahyeon';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 16px;
    background: linear-gradient(135deg, #6a8dff, #a06bff);
    font-family: 'OngleipParkDahyeon', "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    padding: 28px;
  }
  h1 {
    margin: 0 0 20px;
    font-size: 24px;
    text-align: center;
    color: #333;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #todo-input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  #todo-input:focus {
    border-color: #6a8dff;
  }
  #add-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #6a8dff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #add-btn:hover { background: #5678e0; }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .filter-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid #ddd;
    background: #f7f7fb;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
  }
  .filter-btn.active {
    background: #6a8dff;
    color: #fff;
    border-color: #6a8dff;
  }

  #todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 400px;
    overflow-y: auto;
  }
  #todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px;
    border-bottom: 1px solid #f0f0f0;
  }
  #todo-list li:last-child { border-bottom: none; }
  #todo-list input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
    cursor: pointer;
  }
  .todo-text.done {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .delete-btn:hover { color: #ff5c5c; }

  .empty-msg {
    text-align: center;
    color: #bbb;
    padding: 30px 0;
    font-size: 14px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    font-size: 13px;
    color: #888;
  }
  #clear-completed {
    border: none;
    background: transparent;
    color: #888;
    cursor: pointer;
    text-decoration: underline;
    font-size: 13px;
  }
  #clear-completed:hover { color: #ff5c5c; }
</style>
</head>
<body>

<div class="app">
  <h1>📝 할 일 목록</h1>

  <div class="input-row">
    <input type="text" id="todo-input" placeholder="할 일을 입력하세요" maxlength="200">
    <button id="add-btn">추가</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="active">진행중</button>
    <button class="filter-btn" data-filter="completed">완료</button>
  </div>

  <ul id="todo-list"></ul>

  <div class="footer">
    <span id="items-left">0개 남음</span>
    <button id="clear-completed">완료 항목 삭제</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
